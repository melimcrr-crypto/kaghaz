name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk kaghaz-1.0.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Kaghaz v1.0.0
          body: |
            اولین خروجی اندروید «کاغذ»

            - اپ یادداشت‌برداری مارک‌داون، کد اورجینال (Kotlin)
            - نصب: فایل APK را دانلود و اجرا کنید (اجازه نصب از منابع ناشناس لازم است)
            - بیلد: GitHub Actions روی ubuntu-latest با JDK 17 و Gradle 8.7
          files: kaghaz-1.0.0.apk
